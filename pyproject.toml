[project]
name = "aas-auto-generator"
version = "0.1.0"
description = "LLM/DDMS-style Asset Administration Shell auto-generation pipeline skeleton."
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "python-multipart>=0.0.9,<1.0",
    "pdfplumber>=0.11,<1.0",
    "pypdf>=5.0,<7.0",
    "easyocr>=1.7,<2.0",
    "Pillow>=10.0,<13.0",
    "numpy>=1.26,<3.0",
    "ultralytics>=8.3,<9.0",
]

[project.scripts]
aas-generator = "app.main:main"

[tool.pytest.ini_options]
pythonpath = ["."]
